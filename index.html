<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f5f8fc">
    <title>Simple Jumping Game</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
  </head>
  <body>
    <main class="page">
      <header class="page-header">
        <h1>Simple Jumping Game</h1>
        <p class="instructions">Space or ↑ to Jump | ← → or A/D to Move</p>
      </header>

      <section class="game-panel" aria-label="Game">
        <div class="game-status">
          <span class="status-label">Score</span>
          <output id="score-display" class="score" aria-label="Score">00000</output>
        </div>

        <div id="game-area" class="game-area" aria-label="Game play area">
          <div
            id="player"
            class="player"
            role="img"
            aria-label="Player character"
          ></div>
          <div id="obstacles" class="obstacles" aria-hidden="true">
            <!-- <div class="obstacle"></div> -->
          </div>
          <div id="ground" class="ground" aria-hidden="true"></div>
        </div>
        <p class="game-caption">Get ready to run!</p>
      </section>
    </main>
  </body>
</html>
