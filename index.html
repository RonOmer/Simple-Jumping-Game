<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#1a0a2e">
    <title>Branko-jumping Game</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
  </head>
  <body>
    <main class="page">
      <header class="page-header">
        <h1>Branko-jumping Game</h1>
        <p class="instructions">Space or ↑ to Jump | ← → to Move</p>
      </header>

      <section class="game-panel" aria-label="Game">
        <div class="game-status">
          <span class="status-label">Score</span>
          <output id="score-display" class="score" aria-label="Score">00000</output>
        </div>

        <div id="game-area" class="game-area" aria-label="Game play area">
          <div id="clouds" class="clouds"></div>
          <div
            id="player"
            class="player"
            role="img"
            aria-label="Player character"
          ></div>
          <div id="obstacles" class="obstacles" aria-hidden="true">
          </div>
          <div id="ground" class="ground" aria-hidden="true"></div>
          <div id="ground-tiles" class="ground-tiles" aria-hidden="true"></div>
        </div>
        <p class="game-caption">Start going forward, but be careful! The monsters are coming!</p>
      </section>
    </main>
  </body>
</html>
